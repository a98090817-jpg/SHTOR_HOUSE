{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title data-page-title="pageResetDone">Email sent | SHTOR HOUSE</title>

  <link rel="icon" type="image/png" href="{% static 'app/images/shtor-house-logo.png' %}">

  <meta name="csrf-token" content="{{ csrf_token }}" />

  <link rel="stylesheet" href="{% static 'app/css/style.css' %}?v=20">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body class="auth-page">

  <div class="auth-toolbar">

    {% include 'app/partials/language_picker.html' %}

    <button class="theme-toggle btn btn-light" type="button" aria-label="Toggle light and dark mode" data-i18n-aria-label="toggleTheme"><i class="fas fa-moon" aria-hidden="true"></i></button>

  </div>

  <main class="auth-shell login-shell">

    <section class="auth-card login-card">

      <div class="auth-brand"><img class="site-logo-image auth-brand-logo" src="{% static 'app/images/shtor-house-logo.png' %}" alt="SHTOR HOUSE"></div>

      <div class="auth-header">

        <p class="eyebrow" data-i18n="checkInbox">Check your inbox</p>

        <h1 data-i18n="emailSent">Email sent</h1>

        <p class="auth-subtitle" data-i18n="resetSentInfo">If an account exists for that email, reset instructions have been sent.</p>

      </div>

      <p class="switch-text"><a href="{% url 'login' %}" data-i18n="backSignIn">Back to sign in</a></p>

    </section>

  </main>

  <script src="{% static 'app/js/main.js' %}?v=13"></script>

</body>

</html>

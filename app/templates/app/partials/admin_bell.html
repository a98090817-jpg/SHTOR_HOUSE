<div class="admin-bell" data-admin-bell role="button" aria-label="Notifications" tabindex="0">
  <button class="admin-bell-trigger" type="button" aria-expanded="false" aria-label="Notifications" data-i18n-aria-label="notifications" data-admin-bell-toggle>
    <span class="bell-icon">
      <i class="fas fa-bell" aria-hidden="true"></i>
    </span>
    {% if admin_unread_count %}
      <span class="admin-bell-badge" data-admin-bell-badge>{{ admin_unread_count }}</span>
    {% endif %}
  </button>
</div>

{% if admin_unread_count %}
  <div class="admin-toast" data-admin-toast role="status" aria-live="polite">
    <span class="admin-toast-icon"><i class="fas fa-bell" aria-hidden="true"></i></span>
    <div class="admin-toast-copy">
      <strong data-i18n="notifToastTitle">New notifications</strong>
      <span><strong>{{ admin_unread_count }}</strong> <span data-i18n="notifToastText">new activity from your customers</span></span>
    </div>
    <a class="admin-toast-link" href="{% url 'admin_notifications' %}" data-i18n="open">Open</a>
    <button class="admin-toast-close" type="button" data-admin-toast-close aria-label="Close" data-i18n-aria-label="close">×</button>
  </div>
{% endif %}
